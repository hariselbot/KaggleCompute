# KaggleCompute global configuration
quota:
  weekly_gpu_minutes: 1800      # 30 h Kaggle free tier - the whole budget, no paid overflow
  drain_multiplier: 2           # VERIFIED 2026-09-27: 52 GPU-min quota vs ~26 min wall (calibration-002 + manual enable session) => T4x2 drains 2x wall; 30 GPU-h/wk = 15 wall-h of T4x2
paths:
  batch:
    weekly_gpu_minutes: null    # null = uncapped within the global budget
  interactive:
    weekly_gpu_minutes: null
  workbench:
    weekly_gpu_minutes: null
state:
  state_dataset: null           # e.g. "hariselbot/kagglecompute-state" - set after first run
kaggle:
  default_accelerator: null     # CLI 1.7.4.5 cannot select accelerator; pushed kernels take account default GPU
  max_session_hours: 12
profile_defaults: {}
