# KaggleCompute global configuration
quota:
  weekly_gpu_minutes: 1800      # 30 h Kaggle free tier - the whole budget, no paid overflow
  drain_multiplier: 2           # VERIFIED 2026-09-27: 52 GPU-min quota vs ~26 min wall (calibration-002 + manual enable session) => T4x2 drains 2x wall; 30 GPU-h/wk = 15 wall-h of T4x2
paths:
  batch:
    weekly_gpu_minutes: null    # null = uncapped within the global budget
  interactive:
    weekly_gpu_minutes: null
  workbench:
    weekly_gpu_minutes: null
state:
  state_dataset: null           # e.g. "hariselbot/kagglecompute-state" - set after first run
kaggle:
  default_accelerator: null     # CLI 1.7.4.5 cannot select accelerator; pushed kernels take account default GPU
  max_session_hours: 12
profile_defaults: {}
llm_proxy:
  enabled: true
  kaggle_key: null                    # explicit Kaggle API key wins over env vars and ~/.kaggle files; null = fall back
  default_model: anthropic/claude-sonnet-5@default   # local tokens serve a curated subset only (gpt-6-astra is catalog-only)
  # subset served 2026-09-28: anthropic/claude-sonnet-5@default, deepseek-ai/deepseek-r1-0528,
  #   google/gemini-3-flash-preview, google/gemini-3.1-flash-lite-preview, ibm/granite-4.0-h-small,
  #   openai/gpt-5.4-nano-2026-03-17, openai/gpt-oss-120b, qwen/qwen3-next-80b-a3b-instruct
  # use the LLMS_AVAILABLE slug form (vendor/model); override per call with --model
  allowed_models: []                  # empty = allow anything the proxy token serves
  daily_usd_cap: 10.0                 # OUR cap, at/below Kaggle daily refill
  monthly_usd_cap: 100.0              # Kaggle monthly AI credit ($100/month)
  refresh_margin_seconds: 900         # re-mint proxy creds this long before MODEL_PROXY_EXPIRY_TIME
  state_dir: .kc-llm-state            # gitignored; minted creds + usage log live here
